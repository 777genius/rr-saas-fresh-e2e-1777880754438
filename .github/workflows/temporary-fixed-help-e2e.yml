name: Temporary fixed command real PR interaction E2E

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  check:
    if: ${{ github.repository == '777genius/rr-saas-fresh-e2e-1777880754438' && github.event.issue.pull_request && github.event.issue.number == 4 && github.event.comment.user.login == '777genius' && github.event.comment.body == '/rr help' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 777genius/review-router
          ref: 3377089433f70e5ded1a0f8fa5f36c174225f96c
          path: .reviewrouter-runtime
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Run exact pinned Action comment handler
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_ROUTER_MODE: interaction
          REVIEWROUTER_RUNTIME_CONFIG_MODE: static
          REVIEW_ROUTER_REVIEW_WORKFLOW_FILE: reviewrouter.yml
        run: node .reviewrouter-runtime/dist/index.js
