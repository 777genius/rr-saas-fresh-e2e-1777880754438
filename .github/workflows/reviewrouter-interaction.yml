name: Temporary ReviewRouter PR command E2E

on:
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  check:
    if: ${{ github.repository == '777genius/rr-saas-fresh-e2e-1777880754438' && github.event.issue.pull_request && github.event.issue.number == 3 && github.event.comment.user.login == '777genius' && github.event.comment.user.type == 'User' && (startsWith(github.event.comment.body, '/rr ') || startsWith(github.event.comment.body, '@review-router-ai ')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout exact reviewed Action runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 777genius/review-router
          ref: c295717398d54d64ed59d6bb118ac72f3c4a8b3b
          path: .reviewrouter-runtime
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Execute real Github comment handler
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_ROUTER_MODE: interaction
          REVIEWROUTER_RUNTIME_CONFIG_MODE: static
          REVIEW_ROUTER_REVIEW_WORKFLOW_FILE: reviewrouter.yml
        run: node .reviewrouter-runtime/dist/index.js
